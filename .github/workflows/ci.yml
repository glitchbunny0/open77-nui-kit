name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4 python3-pil
      - name: cache RmlUi build
        uses: actions/cache@v4
        with:
          path: ~/.cache/open77-nui-kit
          key: rmlui-6.3-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
      - name: test
        run: scripts/test.sh
