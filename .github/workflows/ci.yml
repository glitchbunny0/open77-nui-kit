name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # html-shot and the rml-preview steps are required here: a missing Chromium or Pillow fails the run instead of
      # skipping those steps (locally they stay optional)
      NUIKIT_REQUIRE_CHROME: "1"
      NUIKIT_REQUIRE_PILLOW: "1"
      PLAYWRIGHT_VERSION: "1.65.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # jsdom 29 (lrbind's tests) needs 20.19+, 22.13+ or 24+
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua5.4 python3-pil
      - name: Chromium headless shell (for html-shot; found under ~/.cache/ms-playwright)
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} install --with-deps chromium-headless-shell
      - name: cache RmlUi build
        uses: actions/cache@v4
        with:
          path: ~/.cache/open77-nui-kit
          key: rmlui-6.3-${{ runner.os }}-${{ hashFiles('scripts/build.sh') }}
      - name: test
        run: scripts/test.sh
